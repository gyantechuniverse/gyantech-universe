<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GyanTech Universe Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><a class="brand" href="index.html"><img src="assets/logo.png"><b>GyanTech Universe</b></a><a class="admin" href="index.html">← Website</a></div></header><main class="wrap"><section class="panel"><h1>📝 Add New Post</h1><p class="note">यह demo browser में posts save करता है। GitHub Pages पर ये posts दूसरे devices पर automatically नहीं दिखेंगी।</p><label>Title</label><input id="title" placeholder="जैसे: SSC CGL Exam City 2026"><label>Category</label><select id="category"><option>Latest Jobs</option><option>Online Form</option><option>Admit Card</option><option>Result</option><option>Answer Key</option><option>Scholarship</option><option>Online Services</option></select><label>Description</label><textarea id="desc" rows="5" placeholder="पोस्ट की जानकारी लिखें..."></textarea><label>Official Link</label><input id="link" placeholder="https://..."><label>Thumbnail URL (optional)</label><input id="image" placeholder="https://..."><button class="publish" onclick="addPost()">Publish Post</button></section><section class="panel"><div class="title"><h2>Published Posts</h2><button onclick="clearPosts()">Delete All</button></div><div id="adminPosts"></div></section></main><script src="app.js"></script></body></html>
